name: Windows PS1 syntax (ParseFile)

on:
  push:
    paths:
      - "app/src/main/java/com/renatizzi/photovideomanager/data/hub/WindowsCatalogSetupScript.kt"
      - "app/src/test/java/com/renatizzi/photovideomanager/data/hub/**"
      - ".github/workflows/windows-ps1-syntax.yml"
  pull_request:
    paths:
      - "app/src/main/java/com/renatizzi/photovideomanager/data/hub/WindowsCatalogSetupScript.kt"
      - "app/src/test/java/com/renatizzi/photovideomanager/data/hub/**"
      - ".github/workflows/windows-ps1-syntax.yml"

jobs:
  parsefile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # "tools" package was removed from SDK; do not let setup-android install it.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Generate sample scripts via unit test helper
        shell: pwsh
        run: |
          ./gradlew :app:testDebugUnitTest --tests "com.renatizzi.photovideomanager.data.hub.WindowsCatalogSetupScriptTest.emitScriptsForCi"
          $candidates = @(
            "app/build/windows_setup_ci/sup.ps1",
            "build/windows_setup_ci/sup.ps1"
          )
          $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $found) { throw "PS1 artifact missing (sup.ps1)" }
          Write-Host "PS1 at $found"

      - name: ParseFile .ps1 and validate .cmd encoding
        shell: pwsh
        run: |
          $ps1 = @(
            "app/build/windows_setup_ci/sup.ps1",
            "build/windows_setup_ci/sup.ps1"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          $cmd = @(
            "app/build/windows_setup_ci/CONFIGURA.cmd",
            "build/windows_setup_ci/CONFIGURA.cmd"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $ps1) { throw "PS1 missing" }
          if (-not $cmd) { throw "CMD missing" }
          $bytes = [System.IO.File]::ReadAllBytes($ps1)
          if ($bytes.Length -lt 3 -or $bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) {
            throw "PS1 must start with UTF-8 BOM"
          }
          $cmdBytes = [System.IO.File]::ReadAllBytes($cmd)
          if ($cmdBytes.Length -ge 3 -and $cmdBytes[0] -eq 0xEF -and $cmdBytes[1] -eq 0xBB -and $cmdBytes[2] -eq 0xBF) {
            throw "CMD must NOT have UTF-8 BOM"
          }
          $cmdText = [System.IO.File]::ReadAllText($cmd)
          if ($cmdText -notmatch "`r`n") { throw "CMD must use CRLF" }
          if ($cmdText[0] -ne '@') { throw "CMD must start with @echo off (no BOM)" }
          $tokens = $null; $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $ps1), [ref]$tokens, [ref]$errors)
          if ($errors -and $errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host $_ }
            throw "ParseFile failed with $($errors.Count) error(s)"
          }
          Write-Host "ParseFile OK; CMD ASCII/CRLF/no-BOM OK"
