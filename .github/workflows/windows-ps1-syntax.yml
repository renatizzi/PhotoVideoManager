name: Windows PS1 syntax (ParseFile)

on:
  push:
    paths:
      - "app/src/main/java/com/renatizzi/photovideomanager/data/hub/WindowsCatalogSetupScript.kt"
      - "app/src/test/java/com/renatizzi/photovideomanager/data/hub/**"
      - ".github/workflows/windows-ps1-syntax.yml"
  pull_request:
    paths:
      - "app/src/main/java/com/renatizzi/photovideomanager/data/hub/WindowsCatalogSetupScript.kt"
      - "app/src/test/java/com/renatizzi/photovideomanager/data/hub/**"
      - ".github/workflows/windows-ps1-syntax.yml"

jobs:
  parsefile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate sample scripts via unit test helper
        shell: pwsh
        run: |
          # Emit scripts using a small inline Kotlin is heavy; instead extract from
          # a committed golden generator run via Gradle test that writes artifacts.
          ./gradlew :app:testDebugUnitTest --tests "com.renatizzi.photovideomanager.data.hub.WindowsCatalogSetupScriptTest.emitScriptsForCi"
          if (-not (Test-Path "app/build/windows_setup_ci/_non_aprire_supporto_setup.ps1")) {
            # Unit tests run with cwd = app/
            if (-not (Test-Path "build/windows_setup_ci/_non_aprire_supporto_setup.ps1")) {
              throw "PS1 artifact missing"
            }
          }

      - name: ParseFile .ps1 and validate .cmd encoding
        shell: pwsh
        run: |
          $ps1 = if (Test-Path "app/build/windows_setup_ci/_non_aprire_supporto_setup.ps1") {
            "app/build/windows_setup_ci/_non_aprire_supporto_setup.ps1"
          } else {
            "build/windows_setup_ci/_non_aprire_supporto_setup.ps1"
          }
          $cmd = if (Test-Path "app/build/windows_setup_ci/AVVIA_Configurazione_Catalogo.cmd") {
            "app/build/windows_setup_ci/AVVIA_Configurazione_Catalogo.cmd"
          } else {
            "build/windows_setup_ci/AVVIA_Configurazione_Catalogo.cmd"
          }
          $bytes = [System.IO.File]::ReadAllBytes($ps1)
          if ($bytes.Length -lt 3 -or $bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) {
            throw "PS1 must start with UTF-8 BOM"
          }
          $cmdBytes = [System.IO.File]::ReadAllBytes($cmd)
          if ($cmdBytes.Length -ge 3 -and $cmdBytes[0] -eq 0xEF -and $cmdBytes[1] -eq 0xBB -and $cmdBytes[2] -eq 0xBF) {
            throw "CMD must NOT have UTF-8 BOM"
          }
          $cmdText = [System.IO.File]::ReadAllText($cmd)
          if ($cmdText -notmatch "`r`n") { throw "CMD must use CRLF" }
          if ($cmdText[0] -ne '@') { throw "CMD must start with @echo off (no BOM)" }
          $tokens = $null; $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $ps1), [ref]$tokens, [ref]$errors)
          if ($errors -and $errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host $_ }
            throw "ParseFile failed with $($errors.Count) error(s)"
          }
          Write-Host "ParseFile OK; CMD ASCII/CRLF/no-BOM OK"
